name: iOS Build

# ⚠️ 手动触发不挂 push/PR: macOS runner 排队久 (标准 runner 在 public 仓库不计费,
# 但每次 push 都占一个 macOS 槽位会拖慢其它构建)。
# 本文件是 iOS 端唯一的编译入口 (从 klib 档到 link/ipa/simulator 全在这里), 需要时手动 dispatch。
# 改 klib 任务名或 -PenableIosTarget=true 开关时, 只需同步本文件内的 stage 分支。
# stage 控制深度, 调试 YAML/脚本语法时用 klib 即可, 不必每次跑完整 ipa。
# iOS 不进 release.yml 流水线: 手动 dispatch 本 workflow, 产物由自带 publish job 发布到
# multiplatform-test 测试 Release (真机 ipa 发包时重建 Release 使提交与排位刷到最新,
# 模拟器包只追加), 供真机侧载与 ios-remote 拉取。
on:
  workflow_dispatch:
    inputs:
      stage:
        description: '构建深度: klib=只编 Kotlin iOS klib / link=编静态库+链接 framework / ipa=完整出未签名 ipa / simulator=出模拟器构建包'
        required: true
        default: 'ipa'
        type: choice
        options:
          - klib
          - link
          - ipa
          - simulator
      publish:
        description: '是否把产物发布到 multiplatform-test Release。关闭时只出 Actions artifact, 不动任何公开 Release (含不删除重建既有 tag)'
        required: false
        default: true
        type: boolean

# 组名不能用 github.workflow: 本文件已无 workflow_call (不被其它工作流调用), 但这个 token
# 在手动触发时就是本工作流名, 与下面拆 stage 的组名不是一路; 保留按 ref+stage 拆分的显式
# 组名, 避免将来恢复 workflow_call 时又撞成调用方占组、被调用 job 等同一个组的死锁。
concurrency:
  # 组按 stage 拆分: 并行发起 ipa 与 simulator 两条构建腿时互不取消
  group: ios-build-${{ github.ref }}-${{ inputs.stage }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # syncIosVersion 用 git rev-list HEAD --count 算 versionCode,
          # shallow 下恒为 1 (与 test.yml 同款取版本方式, 两边必须一致)
          fetch-depth: 0

      - name: Set version
        id: ver
        # 手动触发无版本号入参, 恒按当前时间生成 (test.yml/release.yml 那套上游版本号不再传入)
        # 注: inputs.version 未在 workflow_dispatch.inputs 声明, 恒为空串, 这里保留读取只是
        # 为将来补声明时不必再改本步; 不要据此认为 CI 支持传版本号。
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="$(TZ=Asia/Shanghai date +3.%y.%m%d%H%M)"
          echo "version=$v" >> $GITHUB_OUTPUT

      # ===== iOS 能力完整性守卫 =====
      # 纯 node 读源码做符号比对, 秒级完成、不联网、不占构建时间。
      # 放在最前: iOS 相对 Android 的能力缺口一旦扩大就没必要再烧 macOS runner。
      # 判定口径与白名单见 scripts/ios-capability-matrix.mjs 与
      # Docs/optimization/ios-android-capability-matrix.md。
      - name: Check iOS capability parity
        id: parity
        run: node scripts/ios-capability-matrix.mjs --check

      # 守卫脚本自身的自测: 解析口径/白名单/判定自洽性。
      # 不用 node --test —— iOS 沙盒的 node 不支持该选项, 而本仓库的 iOS 维护场景
      # 要在手机上也能跑一次; 脚本自带断言, 退出码 0/1。
      - name: Test parity guard
        id: paritytest
        run: node scripts/ios-capability-matrix.test.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Gradle build-cache 共享
        # key 必须每次运行唯一: GitHub 对已存在的 key 跳过保存, 固定 key 会让缓存自首次写入后永久冻结;
        # 取用走 restore-keys 前缀 (同 OS 同分支最近一次), 与桌面 macOS 腿共享同一份缓存
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-buildcache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            gradle-buildcache-${{ runner.os }}-${{ github.ref_name }}-
            gradle-buildcache-${{ runner.os }}-

      # ===== 环境诊断: 一次跑完就能定位环境类问题, 避免为查 SDK 路径再开一轮 =====
      - name: Environment diagnostics
        id: diag
        continue-on-error: true
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/ci-logs/00-diagnostics.log") 2>&1
          echo "===== stage = ${{ inputs.stage }} ====="
          sw_vers || true
          xcodebuild -version || true
          xcode-select -p || true
          xcrun --sdk iphoneos --show-sdk-path || true
          xcrun --sdk iphoneos --show-sdk-version || true
          xcrun --sdk iphonesimulator --show-sdk-path || true
          xcrun --sdk iphoneos --find clang || true
          java -version || true
          df -h || true
          sysctl -n hw.ncpu || true
          echo "===== konan ====="
          ls -la ~/.konan 2>/dev/null || echo "(no ~/.konan yet)"
          grep -n "kotlin *=" gradle/libs.versions.toml || true
          # 工具链版本落进 step outputs: 静态库缓存 key 必须含 Xcode/SDK 维度, 否则
          # macos-latest 换代后仍命中旧 .a (PRD 10.2 点名的核查项)。
          XCODE_VER="$(xcodebuild -version 2>/dev/null | head -1 | tr ' ' '-' | tr -d '"')"
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null | tr -d '"')"
          echo "xcode=${XCODE_VER:-unknown}" >> "$GITHUB_OUTPUT"
          echo "sdk=${SDK_VER:-unknown}" >> "$GITHUB_OUTPUT"

      # Kotlin/Native 工具链 (~1GB) 缓存, 省掉每轮重新下载
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # 静态库只依赖 C 源与构建脚本, 命中即跳过 (quickjs.c 2MB, -O2 编译约 1~2 分钟)
      - name: Cache iOS native static libs
        id: cache-native
        if: inputs.stage != 'klib'
        uses: actions/cache@v5
        with:
          path: data/build/iosNativeLibs
          # key 必须含工具链维度: 静态库由 Xcode 的 clang 与 SDK 编译, 只 hash 源码会让
          # macos-latest 换代后继续复用旧架构/旧 SDK 的 .a, 表现为链接期符号或版本不匹配。
          key: ios-native-${{ runner.os }}-xcode${{ steps.diag.outputs.xcode }}-sdk${{ steps.diag.outputs.sdk }}-${{ hashFiles('modules/quickjs/src/main/cinterop/quickjs-ng/**', 'scripts/build-ios-native.sh') }}

      - name: Build iOS native static libs (quickjs-ng)
        id: native
        if: inputs.stage != 'klib' && steps.cache-native.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          chmod +x scripts/build-ios-native.sh
          ./scripts/build-ios-native.sh ios_arm64 ios_simulator_arm64 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/10-build-ios-native.log"

      - name: Verify static libs
        if: inputs.stage != 'klib'
        continue-on-error: true
        run: |
          set -x
          ls -lR data/build/iosNativeLibs || true
          for a in $(find data/build/iosNativeLibs -name '*.a'); do
            lipo -info "$a" || true
          done

      # ===== Kotlin 侧编译 =====
      # --continue: 一个 task 失败仍继续其他 task, 一轮拿到全部错误 (Kotlin 编译器本身也一次报全部错误)
      - name: List iOS gradle tasks
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :ui:tasks --all --console=plain 2>&1 \
            | grep -i -E "ios|cinterop|framework" \
            | tee "$GITHUB_WORKSPACE/ci-logs/20-ios-tasks.log" || true

      - name: Compile shared iOS klib
        id: klib
        continue-on-error: true
        run: |
          set -o pipefail
          # klib 档用途是语法/类型校验, 与最终产物无关, 固定真机 target。
          # 下面这套 --info/--continue 是手动作业的排查便利; 换 target 时与上面 stage
          # 输入的可选值同步。
          ./gradlew :ui:compileKotlinIosArm64 -PenableIosTarget=true \
            --info --stacktrace --warning-mode all --continue --console=plain 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/30-compile-klib.log"

      - name: Link shared framework
        id: link
        # stage=simulator 的 framework 由 xcodebuild 内部 Gradle 链接, 真机 framework 无用
        if: inputs.stage != 'klib' && inputs.stage != 'simulator'
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "${{ inputs.stage }}" = "ipa" ]; then
            TASK=":ui:linkReleaseFrameworkIosArm64"
          else
            TASK=":ui:linkDebugFrameworkIosArm64"
          fi
          echo "===== gradle $TASK ====="
          ./gradlew "$TASK" \
            --info --stacktrace --warning-mode all --continue --console=plain 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/40-link-framework.log"
          echo "===== framework 产物 ====="
          find ui/build/bin -maxdepth 4 -name "*.framework" -exec ls -ld {} \; || true

      # ===== ipa (未签名, 供 SideStore/AltStore/Xcode 自签侧载) =====
      - name: Install XcodeGen
        if: inputs.stage == 'ipa' || inputs.stage == 'simulator'
        continue-on-error: true
        run: brew install xcodegen

      # 必须在 xcodegen generate 之前把版本号落进 project.yml/Info.plist。
      # 不能只靠 iosApp 的 preBuildScript: 该阶段与 ProcessInfoPlistFile 并发,
      # 写入落在 plist 处理之后, 产物里仍是 project.yml 里的占位值。
      # 传 -PappVersion 用上游算好的版本号, 保证 bundle 版本 = ipa 文件名 = 安卓 versionName。
      - name: Sync iOS version
        id: syncver
        if: inputs.stage == 'ipa' || inputs.stage == 'simulator'
        run: ./gradlew syncIosVersion -PappVersion=${{ steps.ver.outputs.version }} --console=plain

      - name: Generate Xcode project
        if: inputs.stage == 'ipa' || inputs.stage == 'simulator'
        continue-on-error: true
        working-directory: iosApp/
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/50-xcodegen.log"

      # ===== 模拟器包 (stage=simulator, 供 multiplatform-test 与 ios-remote) =====
      - name: Build for simulator
        id: simbuild
        if: inputs.stage == 'simulator'
        continue-on-error: true
        working-directory: iosApp/
        run: |
          set -o pipefail
          # build (不是 archive): 模拟器要的是 iphonesimulator SDK 下的 .app。
          # Debug 配置: 本仓只注册了 iosArm64/iosSimulatorArm64 (无 iosX64), Release 下
          # xcodebuild 传 ARCHS="arm64 x86_64", Gradle 的 syncComposeResourcesForIos
          # 直接报 Unknown iOS simulator arch; generic destination 无 active arch,
          # 故显式钉 ARCHS=arm64, 不依赖 ONLY_ACTIVE_ARCH 的默认值。
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simdd \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            LEGADO_APP_VERSION="${{ steps.ver.outputs.version }}" 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/70-xcodebuild-sim.log"

      - name: Package simulator zip
        id: simzip
        if: inputs.stage == 'simulator'
        continue-on-error: true
        working-directory: iosApp/
        run: |
          set -ex
          APPS_DIR=build/simdd/Build/Products/Debug-iphonesimulator
          APP_PATH="$(find "$APPS_DIR" -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          cd "$APPS_DIR"
          zip -qry "$GITHUB_WORKSPACE/iosApp/build/legado-${{ steps.ver.outputs.version }}-ios-simulator.zip" "$(basename "$APP_PATH")"
          ls -lh "$GITHUB_WORKSPACE/iosApp/build/"*-ios-simulator.zip

      - name: Upload simulator artifact
        if: inputs.stage == 'simulator'
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator
          path: ${{ github.workspace }}/iosApp/build/*-ios-simulator.zip
          # 模拟器包是 multiplatform-test 的发布契约; 缺失或上传失败必须让工作流失败。
          if-no-files-found: error

      - name: Archive (unsigned)
        id: archive
        if: inputs.stage == 'ipa'
        continue-on-error: true
        working-directory: iosApp/
        run: |
          set -o pipefail
          # 无 Apple 证书: 关掉全部签名。CODE_SIGN_STYLE=Manual 是为了绕开
          # Automatic 在 DEVELOPMENT_TEAM 为空时的 "requires a development team" 报错。
          xcodebuild archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            LEGADO_APP_VERSION="${{ steps.ver.outputs.version }}" 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/60-archive.log"

      - name: Package unsigned IPA
        id: ipa
        if: inputs.stage == 'ipa'
        continue-on-error: true
        working-directory: iosApp/
        run: |
          set -ex
          # 未签名 ipa 不走 xcodebuild -exportArchive (它一定要签名身份+描述文件),
          # 直接按 ipa 规范打 Payload/ zip —— 侧载工具会自行重签。
          APP_PATH="$(find build/iosApp.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry "legado-${{ steps.ver.outputs.version }}-ios-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh *.ipa
          unzip -l *.ipa | head -30

      - name: Upload IPA artifact
        if: inputs.stage == 'ipa'
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa-unsigned
          path: ${{ github.workspace }}/iosApp/build/ipa/*.ipa
          # IPA 是 stage=ipa 的发布契约；缺失或上传失败必须让工作流失败。
          if-no-files-found: error

      # ===== 产物结构校验: 把"配置声明的最低系统"与"实际产物"对上 (PRD 9.2 AT18 / 10.4) =====
      # 只做可机器判定的项: 最低系统 / 架构 / 内嵌 framework / 版本号一致性 / 扩展嵌入。
      # 签名有效性与真机安装不在本步骤范围 —— 未签名 IPA 由侧载工具重签, 无法在此证明可安装。
      - name: Verify IPA structure
        id: ipacheck
        if: inputs.stage == 'ipa'
        continue-on-error: true
        working-directory: iosApp/
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/ci-logs/80-verify-ipa.log") 2>&1
          set -x
          IPA="$(ls build/ipa/*.ipa 2>/dev/null | head -1)"
          test -n "$IPA"
          rm -rf build/verify && mkdir -p build/verify
          unzip -q "$IPA" -d build/verify
          APP="$(find build/verify/Payload -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP"
          PLIST="$APP/Info.plist"
          test -f "$PLIST"

          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST" 2>/dev/null || true)"
          SHORT_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST" 2>/dev/null || true)"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" 2>/dev/null || true)"
          EXEC_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST" 2>/dev/null || true)"
          echo "MinimumOSVersion=$MIN_OS"
          echo "CFBundleShortVersionString=$SHORT_VER"
          echo "CFBundleIdentifier=$BUNDLE_ID"

          FAILED=0
          check() { if [ "$2" = "1" ]; then echo "OK   - $1"; else echo "FAIL - $1"; FAILED=1; fi; }

          # 1) 最低系统必须存在且不高于目标 iOS15 (PRD FR-02: 不得静默抬高到 16+)
          if [ -n "$MIN_OS" ]; then
            check "MinimumOSVersion 存在 ($MIN_OS)" 1
            MAJOR="${MIN_OS%%.*}"
            if [ "$MAJOR" -le 15 ] 2>/dev/null; then
              check "MinimumOSVersion <= 15 ($MIN_OS)" 1
            else
              check "MinimumOSVersion <= 15 (实际 $MIN_OS, 已超出 iOS15 目标)" 0
            fi
          else
            check "MinimumOSVersion 存在" 0
          fi

          # 2) 主二进制与架构
          BIN="$APP/${EXEC_NAME:-legado}"
          if [ -f "$BIN" ]; then
            check "主二进制存在 ($(basename "$BIN"))" 1
            ARCHS="$(lipo -archs "$BIN" 2>/dev/null || true)"
            echo "archs=$ARCHS"
            case "$ARCHS" in
              *arm64*) check "主二进制含 arm64" 1 ;;
              *) check "主二进制含 arm64 (实际: $ARCHS)" 0 ;;
            esac
          else
            check "主二进制存在 ($BIN)" 0
          fi

          # 3) Kotlin shared framework 必须真的打进 Payload (否则运行期 dyld 直接崩)
          if [ -d "$APP/Frameworks" ]; then
            ls -1 "$APP/Frameworks" | sed 's/^/  framework: /'
            if [ -d "$APP/Frameworks/shared.framework" ]; then
              check "内嵌 shared.framework" 1
            else
              check "内嵌 shared.framework" 0
            fi
          else
            check "Frameworks 目录存在" 0
          fi

          # 4) 版本号与 IPA 文件名一致 (syncIosVersion 双写 + CI 文件名同源)
          IPA_NAME="$(basename "$IPA")"
          case "$IPA_NAME" in
            *"$SHORT_VER"*) check "IPA 文件名版本与 Info.plist 一致 ($IPA_NAME)" 1 ;;
            *) check "IPA 文件名版本与 Info.plist 一致 (文件名 $IPA_NAME, plist $SHORT_VER)" 0 ;;
          esac

          # 5) 分享扩展随包嵌入 (未签名下 entitlement 取不到, 但二进制必须在)
          if [ -d "$APP/PlugIns/ShareExtension.appex" ]; then
            check "ShareExtension 已嵌入" 1
          else
            check "ShareExtension 已嵌入" 0
          fi

          if [ "$FAILED" = "1" ]; then
            echo "::error::IPA 结构校验失败, 详见 ios-build-logs 的 80-verify-ipa.log"
            exit 1
          fi

      # ===== 构建元信息: 记录真实工具链与产物事实 (PRD 10.4 build-info) =====
      # 不参与成败判定 (continue-on-error): 元信息缺失要可见, 但不应把一次成功构建判成失败。
      - name: Emit build-info
        id: buildinfo
        if: inputs.stage == 'ipa' || inputs.stage == 'simulator'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          cd "$GITHUB_WORKSPACE"
          KT="$(sed -n 's/^kotlin *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml | head -1)"
          CMP="$(sed -n 's/^cmp *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml | head -1)"
          GRADLE_VER="$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties | head -1)"
          XCODE="$(xcodebuild -version 2>/dev/null | head -1 | tr -d '"')"
          SDK="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null | tr -d '"')"
          JAVA_V="$(java -version 2>&1 | head -1 | tr -d '"')"
          VER="${{ steps.ver.outputs.version }}"
          STAGE="${{ inputs.stage }}"
          if [ "$STAGE" = "ipa" ]; then
            PRODUCT="legado-${VER}-ios-unsigned.ipa"
          else
            PRODUCT="legado-${VER}-ios-simulator.zip"
          fi
          OUT="$GITHUB_WORKSPACE/ci-logs/build-info.json"
          {
            printf '{\n'
            printf '  "repository": "%s",\n' "$GITHUB_REPOSITORY"
            printf '  "commit": "%s",\n' "$GITHUB_SHA"
            printf '  "ref": "%s",\n' "$GITHUB_REF_NAME"
            printf '  "run_id": "%s",\n' "$GITHUB_RUN_ID"
            printf '  "run_attempt": "%s",\n' "$GITHUB_RUN_ATTEMPT"
            printf '  "stage": "%s",\n' "$STAGE"
            printf '  "version": "%s",\n' "$VER"
            printf '  "build_time_utc": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "xcode": "%s",\n' "$XCODE"
            printf '  "iphoneos_sdk": "%s",\n' "$SDK"
            printf '  "java": "%s",\n' "$JAVA_V"
            printf '  "kotlin": "%s",\n' "$KT"
            printf '  "compose_multiplatform": "%s",\n' "$CMP"
            printf '  "gradle": "%s",\n' "$GRADLE_VER"
            printf '  "deployment_target_configured": "14.0",\n'
            printf '  "architectures": "arm64",\n'
            printf '  "signing": "unsigned (CODE_SIGNING_ALLOWED=NO)",\n'
            printf '  "artifact": "%s"\n' "$PRODUCT"
            printf '}\n'
          } > "$OUT"
          cat "$OUT"

      # 失败时最需要日志, 故 always()
      - name: Collect logs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          cp -R "$HOME/.konan/kotlin-native-prebuilt"*/konan/konan.properties "$GITHUB_WORKSPACE/ci-logs/" 2>/dev/null || true
          find "$GITHUB_WORKSPACE/ui/build/reports" -type f 2>/dev/null | head -50 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-logs
          path: |
            ${{ github.workspace }}/ci-logs/**
            ${{ github.workspace }}/ui/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      # 各步都是 continue-on-error, 这里统一判定成败, 保证一轮跑完能同时看到所有失败点
      - name: Summarize result
        if: always()
        run: |
          FAILED=0
          report() {
            echo "- $1: $2"
            echo "- $1: $2" >> $GITHUB_STEP_SUMMARY
            if [ "$2" = "failure" ]; then FAILED=1; fi
          }
          echo "## iOS build (stage=${{ inputs.stage }}) 结果" >> $GITHUB_STEP_SUMMARY
          report "native static libs" "${{ steps.native.outcome || 'skipped' }}"
          report "sync iOS version" "${{ steps.syncver.outcome || 'skipped' }}"
          report "compile klib" "${{ steps.klib.outcome || 'skipped' }}"
          report "link framework" "${{ steps.link.outcome || 'skipped' }}"
          report "xcodebuild archive" "${{ steps.archive.outcome || 'skipped' }}"
          report "package ipa" "${{ steps.ipa.outcome || 'skipped' }}"
          report "verify ipa structure" "${{ steps.ipacheck.outcome || 'skipped' }}"
          # build-info 只记录不判失败: 元信息缺失要可见, 但不应把一次成功构建判成失败
          echo "- build-info: ${{ steps.buildinfo.outcome || 'skipped' }}"
          echo "- build-info: ${{ steps.buildinfo.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          report "simulator build" "${{ steps.simbuild.outcome || 'skipped' }}"
          report "package simulator" "${{ steps.simzip.outcome || 'skipped' }}"
          if [ "$FAILED" = "1" ]; then
            echo "有步骤失败, 详见 ios-build-logs artifact"
            exit 1
          fi

  # 手动构建完成后发布到 multiplatform-test 测试 Release: 真机 ipa 重建 Release
  # (提交与排位刷到最新, 旧资产清空), 模拟器包只追加不动既有资产;
  # klib/link 是调试档无产物, 不发布。
  publish-multiplatform-test:
    needs: ios
    # inputs.publish=false 时只出 artifact: 不碰 multiplatform-test 的 tag 与既有资产
    # (真机 ipa 那条会删除重建 Release, 见 _publish.yml; PRD 10.3 要求不经用户要求不改公开 Release)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && (inputs.stage == 'ipa' || inputs.stage == 'simulator') }}
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      tag: multiplatform-test
      artifact-name-pattern: ${{ inputs.stage == 'simulator' && 'ios-simulator' || 'ios-ipa-unsigned' }}
      # 测试包不得抢占 releases/latest: 正式版链接要停在含安卓与桌面安装件的版本上
      prerelease: true
      name: multiplatform-test
